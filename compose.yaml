name: ${MUYUN_APP_COMPOSE_PROJECT:-muyunspring-app}

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: muyun_dev
      POSTGRES_DB: ${MUYUN_APP_POSTGRES_DB:-muyun_spring_app}
    ports:
      - "${MUYUN_APP_POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
    name: ${MUYUN_APP_POSTGRES_VOLUME:-muyun-spring-app-postgres}
